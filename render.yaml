services:
  # OceanScope FastAPI Backend Web Service
  - type: web
    name: oceanscope-backend
    runtime: python
    rootDir: OceanScope/backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: INCOIS_ERDDAP_BASE_URL
        value: "https://erddap.incois.gov.in/erddap/"
      - key: CACHE_EXPIRATION_SECONDS
        value: "600"
      - key: HYCOM_DATA_SOURCE
        value: "remote"
      - key: HYCOM_REMOTE_OPENDAP_URL
        value: "https://tds.hycom.org/thredds/dodsC/GLBy0.08/expt_93.0"
      - key: HYCOM_DATASET_ID
        value: "GLBy0.08_expt_93.0"

  # OceanScope React/Vite Frontend Static Site
  - type: web
    name: oceanscope-frontend
    runtime: static
    rootDir: OceanScope/frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: oceanscope-backend
          property: host
