version: "3.8"

services:
  backend:
    build:
      context: ./OceanScope/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - CORS_ALLOWED_ORIGINS=*
      - INCOIS_ERDDAP_BASE_URL=https://erddap.incois.gov.in/erddap/
      - HYCOM_DATA_DIRECTORY=/data/hycom
      - CACHE_EXPIRATION_SECONDS=600
      - COPERNICUSMARINE_SERVICE_USERNAME=${COPERNICUSMARINE_SERVICE_USERNAME:-}
      - COPERNICUSMARINE_SERVICE_PASSWORD=${COPERNICUSMARINE_SERVICE_PASSWORD:-}
    volumes:
      - hycom_data:/data/hycom
    restart: unless-stopped

  frontend:
    build:
      context: ./OceanScope/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_APP_TITLE: OceanScope
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hycom_data:
    driver: local
